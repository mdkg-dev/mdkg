edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
readme = "README.md"

[dependencies]
mdkg-format = { path = "../mdkg-format", version = "0.7.3" }
mdkg-graph = { path = "../mdkg-graph", version = "0.7.3" }
mdkg-coord-sqlite = { path = "../mdkg-coord-sqlite", version = "0.7.3" }
# Served writes apply inside the kernel's open store transaction (S16).
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
