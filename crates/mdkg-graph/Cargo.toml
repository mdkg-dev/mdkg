[package]
name = "mdkg-graph"
version = "0.7.3"
description = "Load, index, query and validate mdkg graphs. Internal to mdkg, no stable API; depend on the mdkg binary"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage.workspace = true
readme = "README.md"

[dependencies]
# Read immutable graph objects through the shared hardened Git boundary.
mdkg-git = { path = "../mdkg-git", version = "0.7.3" }
mdkg-format = { path = "../mdkg-format", version = "0.7.3", features = ["settings-fs"] }
serde_json.workspace = true
# Graph sync pins git setup as digests, never values (Terra #18946).
sha2.workspace = true
# Review of 13b3e6e: templates are read through folder handles opened from
# the repository root, never through a second path lookup.
rustix = { workspace = true, features = ["process"] }

[lints]
workspace = true
