[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/mdkg-dev/mdkg"
homepage = "https://mdkg.dev"
rust-version = "1.95"

# Dependency allowlist. Add a crate here, with the reason in a comment, before
# any member crate uses it.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v7"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
proptest = "1"
# The local coordinator store. Bundled, so no system SQLite.
rusqlite = { version = "0.39", features = ["bundled", "backup"] }
# JSON Schema generated from the Rust output types.
schemars = "1"
# `install` edits users' .codex/config.toml in place, keeping comments and
# layout; from the toml-rs maintainers. Default features only.
toml_edit = "=0.25.16"
# `install` writes into a project through folder handles
# (openat, renameat, unlinkat with O_NOFOLLOW), so a link a running agent
# swaps in can't redirect a write. std has no *at calls and the workspace
# forbids unsafe code, so libc is out; rustix wraps them safely. Already in
# Cargo.lock (through tempfile). Only its `fs` feature.
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# The profile cargo-dist builds release artifacts with (dist-workspace.toml).
[profile.dist]
inherits = "release"
lto = "thin"
