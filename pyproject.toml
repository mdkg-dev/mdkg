# PyPI's `mdkg`: the mdkg binary in a wheel (maturin's bin bindings), so
# `pip install mdkg` (or `pipx install mdkg`, `uv tool install mdkg`) puts
# `mdkg` on PATH. There is no Python API. The version comes from the
# binary crate's Cargo.toml. Built and published by
# .github/workflows/pypi.yml.
[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "mdkg"
dynamic = ["version"]
description = "Local-first knowledge graph and coordination kernel for humans and coding agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.8"
keywords = ["agents", "knowledge-graph", "markdown", "git", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://mdkg.dev"
Repository = "https://github.com/mdkg-dev/mdkg"
Changelog = "https://github.com/mdkg-dev/mdkg/blob/main/CHANGELOG.md"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/mdkg-cli/Cargo.toml"
strip = true
