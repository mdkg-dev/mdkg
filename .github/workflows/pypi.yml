# PyPI's `mdkg`: wheels holding the mdkg binary (maturin's bin bindings,
# pyproject.toml), built for the same targets as the release, plus an
# sdist. A version tag builds them; publishing waits in the `pypi`
# environment for a maintainer's approval, then uploads through PyPI's
# trusted publishing (no token is stored). It may trail the release, so
# it can also be run by hand on a tag.
name: PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: read

# The build runs inside manylinux and musllinux containers, which may lack
# git; build.rs reads the commit for `--version`.
env:
  GIT_IN_CONTAINER: >-
    (command -v git >/dev/null ||
     (command -v dnf >/dev/null && dnf install -y git) ||
     (command -v yum >/dev/null && yum install -y git) ||
     (command -v apk >/dev/null && apk add --no-cache git)) &&
    git config --global --add safe.directory '*'

jobs:
  wheels:
    name: wheel (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, manylinux: "2_28" }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, manylinux: "2_28" }
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          before-script-linux: ${{ env.GIT_IN_CONTAINER }}
          args: --release --locked --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    # Configure this environment with a required reviewer, and register
    # this workflow as the project's trusted publisher on PyPI.
    environment:
      name: pypi
      url: https://pypi.org/project/mdkg/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
