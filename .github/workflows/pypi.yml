# PyPI's `mdkg`: wheels holding the mdkg binary (maturin's bin bindings,
# pyproject.toml), built for the same targets as the release, plus an
# sdist. A version tag builds them; publishing waits in the `pypi`
# environment for a maintainer's approval, then uploads through PyPI's
# trusted publishing (no token is stored). It may trail the release, so
# it can also be run by hand on a tag.
name: PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  contents: read

# The build runs inside manylinux and musllinux containers, which may lack
# git; build.rs reads the commit for `--version`, and needs git 2.41 or
# newer (`--attr-source`) to say whether the tree was clean: an older git
# names the commit but prints "dirty unknown". The musl containers
# (rust-musl-cross, Ubuntu-based) have such a git: the 0.7.1 musl wheels
# printed it. So an old git is upgraded (from the git-core PPA where
# apt-get is the package manager). The
# build fails if git is still older, and each wheel's --version is
# checked after the build.
env:
  GIT_IN_CONTAINER: >-
    git_new() {
      set -- $(git --version 2>/dev/null | sed -n 's/^git version \([0-9][0-9]*\)\.\([0-9][0-9]*\).*/\1 \2/p');
      [ "${1:-0}" -gt 2 ] || { [ "${1:-0}" -eq 2 ] && [ "${2:-0}" -ge 41 ]; };
    };
    git_new ||
    (command -v dnf >/dev/null && dnf install -y git) ||
    (command -v yum >/dev/null && yum install -y git) ||
    (command -v apk >/dev/null && apk add --no-cache git) ||
    (command -v apt-get >/dev/null && export DEBIAN_FRONTEND=noninteractive &&
     apt-get update && apt-get install -y software-properties-common &&
     add-apt-repository -y ppa:git-core/ppa && apt-get update && apt-get install -y git) ||
    true;
    { git_new || { echo "git 2.41 or newer is needed for a clean --version; found: $(git --version 2>&1)" >&2; false; }; } &&
    git config --global --add safe.directory '*'

jobs:
  wheels:
    name: wheel (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          # The Linux wheels build without FIDO2 (--no-default-features):
          # its hidapi backend links libudev, which auditwheel would copy into
          # the wheel with the system libraries it links (decided 2026-11-03,
          # #17661). Their --version says so; FIDO2 person keys are in the
          # release archives, Homebrew and cargo builds.
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, manylinux: "2_28", features: --no-default-features }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, manylinux: "2_28", features: --no-default-features }
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2, features: --no-default-features }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2, features: --no-default-features }
    runs-on: ${{ matrix.runner }}
    # The rehearsal's wheels took about 4 minutes; v0.7.1's x86_64 gnu
    # wheel took 33. Past 30, fail the job rather than stall the release.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          before-script-linux: ${{ env.GIT_IN_CONTAINER }}
          args: --release --locked --out dist ${{ matrix.features }}
      # Every target's binary runs on its runner: macOS natively, and the
      # Linux ones on a runner of their architecture (musl binaries are
      # static). A wheel that bundles libraries would have maturin's Python
      # launcher in .data/scripts instead of the binary, which only works
      # installed, so such a wheel is installed into a fresh venv and its
      # mdkg run; none should now (the next step refuses one). A wheel whose
      # --version lacks this checkout's commit, or says dirty, or a Linux
      # wheel whose --version doesn't say it has no FIDO2, fails here,
      # before anything is uploaded.
      - name: Check the wheel's --version names a clean commit
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          [ "${#wheels[@]}" -eq 1 ] || { echo "::error::expected one wheel, found ${#wheels[@]}"; exit 1; }
          unpacked=$(mktemp -d)
          python3 -m zipfile -e "${wheels[0]}" "$unpacked"
          bins=("$unpacked"/*.data/scripts/mdkg)
          [ "${#bins[@]}" -eq 1 ] || { echo "::error::no mdkg binary in ${wheels[0]}"; exit 1; }
          bin=${bins[0]}
          if python3 -c 'import sys; sys.exit(open(sys.argv[1], "rb").read(2) != b"#!")' "$bin"; then
            python3 -m venv "$unpacked/venv"
            "$unpacked/venv/bin/python" -m pip install --quiet --no-index --no-deps "${wheels[0]}"
            # Run the installed launcher itself, as a user would: a wheel
            # that ships it without its execute bit fails here.
            run=("$unpacked/venv/bin/mdkg")
          else
            chmod +x "$bin"
            run=("$bin")
          fi
          line=$("${run[@]}" --version)
          echo "$line"
          want="(commit $(git rev-parse HEAD), built "
          case "$line" in
            *"$want"*) ;;
            *) echo "::error::${wheels[0]}: --version doesn't name clean commit $(git rev-parse HEAD): $line"; exit 1 ;;
          esac
          if [ "$RUNNER_OS" = Linux ]; then
            case "$line" in
              *"; no FIDO2 in this build: "*) ;;
              *) echo "::error::${wheels[0]}: a Linux wheel must build without FIDO2: $line"; exit 1 ;;
            esac
          else
            case "$line" in
              *"; no FIDO2 in this build: "*) echo "::error::${wheels[0]}: a macOS wheel must keep FIDO2: $line"; exit 1 ;;
            esac
          fi
      # A wheel carries no shared libraries beside the binary: auditwheel
      # would copy in any the binary links outside the manylinux allow-list.
      # One that THIRD_PARTY_NOTICES.md doesn't list (none is) fails the
      # build before anything is uploaded.
      - name: Check the wheel bundles no unlisted library
        shell: bash
        run: python3 -I scripts/third-party-notices.py --check-wheel dist/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    # Configure this environment with a required reviewer, and register
    # this workflow as the project's trusted publisher on PyPI.
    environment:
      name: pypi
      url: https://pypi.org/project/mdkg/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
